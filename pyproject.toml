[project]
name = "tex-check"
version = "0.1.0"
description = "Proofread the prose in LaTeX files: repeats, punctuation, spelling, grammar"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
tex-check = "texcheck.cli:main"
tex-check-open = "texcheck.opener:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/texcheck"]

# The browser view's page, stylesheet and script are served from the
# installed package, so they ship as package data.
[tool.hatch.build.targets.wheel.force-include]
"src/texcheck/web/static" = "texcheck/web/static"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `uvx ruff check` lints with these. Curly quotes and dashes are the point
# of a British prose checker, so the ambiguous-character rules are off.
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "PIE", "RET", "PTH", "FURB", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "RUF059"]
