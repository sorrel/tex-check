<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>tex-check</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside class="sidebar">
  <header class="masthead">
    <h1 id="file">tex-check</h1>
    <p id="checked" class="quiet">Checking…</p>
  </header>
  <nav id="groups" aria-label="Groups"></nav>
  <footer class="recheck">
    <p id="status" class="quiet" aria-live="polite"></p>
    <button id="recheck" type="button">Re-check now</button>
  </footer>
</aside>
<main>
  <div id="error" class="error" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-close" type="button" aria-label="Dismiss">×</button>
  </div>
  <header class="group-head">
    <h2 id="group-title"></h2>
    <p id="group-blurb" class="quiet"></p>
  </header>
  <ol id="items" class="items"></ol>
  <p class="keys quiet"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>o</kbd> open in Texifier · <kbd>b</kbd> add for this book · <kbd>e</kbd> add everywhere</p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
