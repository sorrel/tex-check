# Runs the test suite on every push to main and every pull request.
#
# aspell is installed so the spelling tests run rather than skip: they are
# most of what matters. Nothing here touches the network beyond installing.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, not tags: a tag is mutable, so "@v7" is
      # a promise the action's owner can silently rewrite. Dependabot reads
      # the trailing version comment and keeps both SHA and comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's token in .git/config for later steps.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y aspell aspell-en
      - run: uv sync --dev
      - run: uv run pytest -q
      # The oldest Python pyproject allows: annotations are evaluated
      # eagerly there, so a forward reference that works on 3.14 can fail.
      - run: uv run --isolated --python 3.12 pytest -q
      - run: uvx ruff check
